name: Generate Signals (Historical Backfill)

on:
  workflow_dispatch:
    inputs:
      signal_start_date:
        description: 'Start date for signal scan (YYYY-MM-DD). Default: 2025-01-01'
        required: false
        default: '2025-01-01'
      rebuild_db:
        description: 'Rebuild DB from bhav CSVs? (yes/no). Use yes after new bhav data added.'
        required: false
        default: 'yes'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # ~5 h 50 min — GitHub max is 6 h for hosted runners

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy pyarrow requests

      - name: Step 1 – Consolidate bhavcopy CSVs → parquet
        if: ${{ github.event.inputs.rebuild_db != 'no' }}
        run: python src/01_consolidate_csv.py

      - name: Cleanup raw bhav CSVs (keep repo small)
        if: ${{ github.event.inputs.rebuild_db != 'no' }}
        run: |
          find bhav_data/ -name "*.csv" -delete || true
          echo "Bhav CSVs removed"

      - name: Step 2 – Filter EQ series
        if: ${{ github.event.inputs.rebuild_db != 'no' }}
        run: python src/02_filter_eq.py

      - name: Step 3 – Compute ATH per symbol
        if: ${{ github.event.inputs.rebuild_db != 'no' }}
        run: python src/03_find_ath.py

      # ── Step 4: Backfill with checkpoint/resume support ─────────────────────
      # Exit code 0 = fully complete. Exit code 2 = partial (time budget hit),
      # will auto-trigger another run to continue. Other non-zero = real error.
      - name: Step 4 – Historical signal backfill (all dates)
        id: backfill
        run: |
          set +e
          python src/00b_historical_backfill.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 (complete) and 2 (partial) are both expected — don't fail the step
          [ $code -eq 0 ] || [ $code -eq 2 ] && exit 0 || exit $code
        env:
          SIGNAL_START_DATE: ${{ github.event.inputs.signal_start_date || '2025-01-01' }}
          BACKFILL_TIME_BUDGET_MINUTES: "300"   # 5 h budget; ~50 min left for other steps

      # ── Steps 5-6 and public push: only when backfill is fully complete ─────
      - name: Step 5 – Run simulation & build dashboard JSON
        if: steps.backfill.outputs.exit_code == '0'
        id: simulation
        run: |
          set +e
          python src/05_run_simulation.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 (complete) and 2 (partial/time-budget) are both expected
          [ $code -eq 0 ] || [ $code -eq 2 ] && exit 0 || exit $code
        env:
          SKIP_EXCEL: 'true'
          SIM_TIME_BUDGET_MINUTES: '50'

      # Auto-trigger another run when Step 5 hit its time budget
      - name: Auto-trigger resume (simulation partial)
        if: steps.backfill.outputs.exit_code == '0' && steps.simulation.outputs.exit_code == '2'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SIGNAL_START_DATE: ${{ github.event.inputs.signal_start_date || '2025-01-01' }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/gh_trigger_sim.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/spurandhar0/nse-btst-signals-v2/actions/workflows/generate_signals.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"signal_start_date\":\"${SIGNAL_START_DATE}\",\"rebuild_db\":\"no\"}}")
          echo "GitHub API response: $HTTP_CODE"
          cat /tmp/gh_trigger_sim.json || true
          if [ "$HTTP_CODE" -eq 204 ]; then
            echo "↩️  Queued resume run (Step 5 partial — simulation will skip already-done configs)"
          else
            echo "❌ Failed to trigger resume (HTTP $HTTP_CODE) — please re-run manually"
            exit 1
          fi

      - name: Step 6 – Build dashboard HTML
        if: steps.backfill.outputs.exit_code == '0' && steps.simulation.outputs.exit_code == '0'
        run: python src/05_build_dashboard.py

      - name: Push dashboard to public repo
        if: steps.backfill.outputs.exit_code == '0' && steps.simulation.outputs.exit_code == '0'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd /tmp
          git clone https://x-access-token:${GH_PAT}@github.com/spurandhar0/nse-btst-signals-dashboard-v2.git pub-dashboard
          mkdir -p pub-dashboard/docs/data

          # index.html — always required
          cp $GITHUB_WORKSPACE/docs/index.html pub-dashboard/docs/index.html

          # sim_results per-config JSON files
          for cfg_file in $GITHUB_WORKSPACE/docs/data/sim_results_C*.json; do
            [ -f "$cfg_file" ] && cp "$cfg_file" pub-dashboard/docs/data/ || true
          done

          # sim_meta.json
          [ -f "$GITHUB_WORKSPACE/docs/data/sim_meta.json" ] \
            && cp $GITHUB_WORKSPACE/docs/data/sim_meta.json pub-dashboard/docs/data/sim_meta.json \
            || echo "⚠  sim_meta.json not found — skipping"

          # trade_ohlc.json
          [ -f "$GITHUB_WORKSPACE/docs/data/trade_ohlc.json" ] \
            && cp $GITHUB_WORKSPACE/docs/data/trade_ohlc.json pub-dashboard/docs/data/trade_ohlc.json \
            || echo "⚠  trade_ohlc.json not found — skipping"

          # nifty_index.json — optional
          [ -f "$GITHUB_WORKSPACE/docs/data/nifty_index.json" ] \
            && cp $GITHUB_WORKSPACE/docs/data/nifty_index.json pub-dashboard/docs/data/nifty_index.json \
            || true

          cd pub-dashboard
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet && echo "Nothing to push to public repo" || git commit -m "Dashboard update: $(date +'%Y-%m-%d')"
          git push origin main

      - name: Commit private repo data (complete run)
        if: steps.backfill.outputs.exit_code == '0' && steps.simulation.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git rebase origin/main || (git rebase --abort && git merge -X theirs origin/main) || true
          git add db/ docs/ || true
          find output/ -maxdepth 3 \( -name "*.csv" -o -name "*.json" -o -name ".gitignore" \) | xargs git add 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit" || git commit -m "Backfill signals + simulation + dashboard: $(date +'%Y-%m-%d')"
          git push origin HEAD:main

      # ── Partial run: save checkpoint to git, then auto-continue ─────────────
      - name: Commit partial progress + re-trigger next leg
        if: steps.backfill.outputs.exit_code == '2'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          SIGNAL_START_DATE: ${{ github.event.inputs.signal_start_date || '2025-01-01' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git rebase origin/main || (git rebase --abort && git merge -X theirs origin/main) || true
          # Commit partial parquets + checkpoint file so next run can resume
          git add db/ || true
          git diff --staged --quiet \
            && echo "No checkpoint changes to commit" \
            || git commit -m "Partial backfill checkpoint: $(date +'%Y-%m-%d %H:%M')"
          git push origin HEAD:main

          # Self-trigger the next leg (rebuild_db=no skips steps 1-3)
          HTTP_CODE=$(curl -s -o /tmp/gh_trigger.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/spurandhar0/nse-btst-signals-v2/actions/workflows/generate_signals.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"signal_start_date\":\"${SIGNAL_START_DATE}\",\"rebuild_db\":\"no\"}}")
          echo "GitHub API response: $HTTP_CODE"
          cat /tmp/gh_trigger.json || true
          if [ "$HTTP_CODE" -eq 204 ]; then
            echo "✅ Next leg triggered — workflow will continue from checkpoint automatically"
          else
            echo "❌ Failed to trigger next leg (HTTP $HTTP_CODE) — please re-run manually"
            exit 1
          fi

